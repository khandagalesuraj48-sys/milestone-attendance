[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# API requests redirected internally to Express serverless function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# Root health check endpoint redirected to API function
[[redirects]]
  from = "/health"
  to = "/.netlify/functions/api/health"
  status = 200

# React SPA fallback - all other paths serve index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Standard Security & Content Security Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), geolocation=(self), microphone=()"
