<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Left Blue Arch Gradient -->
    <linearGradient id="blueGrad" x1="0%" y1="100%" x2="70%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="50%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>

    <!-- Right Orange Arch Gradient -->
    <linearGradient id="orangeGrad" x1="30%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>

    <!-- Center Overlap Blend -->
    <linearGradient id="centerBlend" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0369A1" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#D97706" stop-opacity="0.8"/>
    </linearGradient>

    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Group for Logo Icon -->
  <g transform="translate(0, 15)">
    <!-- Left Leg / Arch (Cyan to Deep Blue) -->
    <path
      d="M 115 250 L 195 125 C 215 95 255 105 270 135 L 320 235 C 328 250 318 268 300 268 L 285 268 C 275 268 265 262 260 252 L 222 175 C 216 163 200 163 194 175 L 140 260 C 132 272 115 272 105 260 C 98 252 98 240 115 215 Z"
      fill="url(#blueGrad)"
      filter="url(#subtleShadow)"
    />

    <!-- Right Leg / Arch (Warm Amber to Orange) -->
    <path
      d="M 385 250 L 305 125 C 285 95 245 105 230 135 L 180 235 C 172 250 182 268 200 268 L 215 268 C 225 268 235 262 240 252 L 278 175 C 284 163 300 163 306 175 L 360 260 C 368 272 385 272 395 260 C 402 252 402 240 385 215 Z"
      fill="url(#orangeGrad)"
      filter="url(#subtleShadow)"
    />

    <!-- Intersecting Center Ribbon Effect -->
    <path
      d="M 220 180 C 235 150 265 150 280 180 L 315 250 C 320 260 312 268 300 268 L 275 268 C 265 268 258 262 253 252 L 220 180 Z"
      fill="url(#centerBlend)"
      opacity="0.85"
    />
  </g>

  <!-- Typography: MILESTONE -->
  <text
    x="250"
    y="330"
    text-anchor="middle"
    font-family="system-ui, -apple-system, 'Plus Jakarta Sans', sans-serif"
    font-size="46"
    font-weight="900"
    letter-spacing="9"
    fill="#0B1B3D"
  >MILESTONE</text>

  <!-- Orange Line Left -->
  <line x1="45" y1="365" x2="115" y2="365" stroke="#EA580C" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Typography: CONSULTANCY -->
  <text
    x="250"
    y="373"
    text-anchor="middle"
    font-family="system-ui, -apple-system, 'Plus Jakarta Sans', sans-serif"
    font-size="24"
    font-weight="800"
    letter-spacing="7"
    fill="#0B1B3D"
  >CONSULTANCY</text>

  <!-- Orange Line Right -->
  <line x1="385" y1="365" x2="455" y2="365" stroke="#EA580C" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Tagline: Plan | Execute | Sustain -->
  <text
    x="250"
    y="415"
    text-anchor="middle"
    font-family="system-ui, -apple-system, 'Plus Jakarta Sans', sans-serif"
    font-size="22"
    font-style="italic"
    font-weight="600"
    letter-spacing="2.5"
    fill="#0B1B3D"
  >Plan   |   Execute   |   Sustain</text>
</svg>
